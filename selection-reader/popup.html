<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #ffffff; --panel: #f4f6fa; --text: #1b2130; --muted: #636b7c; --line: #e2e6ee;
      --accent: #2f6fde; --accent-text: #ffffff; --ok: #1f8a4c; --warn: #b45309;
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171b24; --panel: #212736; --text: #eef1f6; --muted: #9aa3b5; --line: #2e3546;
        --accent: #4f8cff; --accent-text: #0b1020; --ok: #4cc983; --warn: #f0a24a;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; width: 320px; background: var(--bg); color: var(--text);
           font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
    header img { width: 28px; height: 28px; }
    header h1 { margin: 0; font-size: 15px; font-weight: 650; }
    header p { margin: 0; color: var(--muted); font-size: 12px; }
    main { padding: 4px 16px 16px; }
    section { padding: 12px 0; border-bottom: 1px solid var(--line); }
    section:last-of-type { border-bottom: 0; }
    h2 { margin: 0 0 8px; font-size: 11px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    select { width: 100%; height: 32px; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px;
             background: var(--panel); color: var(--text); font: inherit; }
    .hint { margin: 8px 0 0; color: var(--muted); font-size: 12px; }
    /* Segmented choice (radio buttons styled as one bar) */
    .segmented { display: flex; padding: 3px; gap: 3px; background: var(--panel); border-radius: 9px; }
    .segmented label { flex: 1; }
    .segmented input { position: absolute; opacity: 0; pointer-events: none; }
    .segmented span { display: block; padding: 6px 0; text-align: center; border-radius: 7px; cursor: pointer; color: var(--muted); }
    .segmented input:checked + span { background: var(--bg); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
    .segmented input:focus-visible + span { outline: 2px solid var(--accent); }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    /* Switch */
    .switch { position: relative; width: 36px; height: 20px; flex: none; }
    .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
    .switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line); transition: background .15s; pointer-events: none; }
    .switch span::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
    .switch input:checked + span { background: var(--accent); }
    .switch input:checked + span::after { transform: translateX(16px); }
    .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
    button { height: 32px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); flex: none;
             background: var(--panel); color: var(--text); font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
    button:hover { filter: brightness(0.97); }
    button:disabled { opacity: .6; cursor: default; }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    /* Benchmark results */
    .bench { margin-top: 10px; display: grid; gap: 6px; }
    .bench .result { display: flex; justify-content: space-between; gap: 8px; padding: 8px 10px; background: var(--panel); border-radius: 8px; }
    .bench .speed { font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .bench .speed.ok { color: var(--ok); }
    .bench .speed.slow { color: var(--warn); }
    .bench .detail { color: var(--muted); font-size: 12px; }
    footer { display: flex; align-items: center; gap: 10px; padding-top: 12px; }
    #status { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon-32.png" alt="">
    <div>
      <h1>Selection Reader</h1>
      <p>Select text on any page and press Read.</p>
    </div>
  </header>
  <main>
    <section>
      <h2><label for="voice">Voice</label></h2>
      <select id="voice"></select>
      <p class="hint" id="hint" hidden></p>
    </section>

    <section>
      <h2 id="speed-title">Speed</h2>
      <div class="segmented" role="radiogroup" aria-labelledby="speed-title" id="speed"></div>
    </section>

    <section id="kokoro" hidden>
      <h2 id="device-title">Kokoro runs on</h2>
      <div class="segmented" role="radiogroup" aria-labelledby="device-title" id="device">
        <label><input type="radio" name="device" value="auto"><span>Auto</span></label>
        <label><input type="radio" name="device" value="gpu"><span>GPU</span></label>
        <label><input type="radio" name="device" value="cpu"><span>CPU</span></label>
      </div>
      <p class="hint" id="device-hint"></p>
      <div class="row" style="margin-top: 10px">
        <span class="hint" style="margin: 0">How fast is each on this computer?</span>
        <button id="bench-run">Test speed</button>
      </div>
      <div class="bench" id="bench" aria-live="polite"></div>
    </section>

    <section>
      <div class="row">
        <label for="highlight">Highlight each word while reading</label>
        <span class="switch"><input type="checkbox" id="highlight"><span></span></span>
      </div>
    </section>

    <footer>
      <button class="primary" id="test">Play sample</button>
      <span id="status" aria-live="polite"></span>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
